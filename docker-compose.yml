services:
  mariadb:
    image: mariadb:latest
    container_name: arquitectura-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    ports:
      - "${MARIADB_PORT}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - arquitectura-net

  mysql:
    image: mysql:8
    container_name: arquitectura-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - arquitectura-net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: arquitectura-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "${SQLSERVER_PORT}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./docker/sqlserver/init.sql:/init.sql:ro
    networks:
      - arquitectura-net

  payara:
    image: payara/server-full:latest
    container_name: arquitectura-payara
    ports:
      - "${PAYARA_APP_PORT}:8080"
      - "${PAYARA_ADMIN_PORT}:4848"
    networks:
      - arquitectura-net

  glassfish:
    build:
      context: ./docker/glassfish
      dockerfile: Dockerfile
    image: glassfish7-arquitectura:latest
    container_name: arquitectura-glassfish
    ports:
      - "${GLASSFISH_APP_PORT}:8080"
      - "${GLASSFISH_ADMIN_PORT}:4848"
    networks:
      - arquitectura-net

  dotnet-rest-api:
    build:
      context: ./servidores/dotnet-rest-api
      dockerfile: Dockerfile
    container_name: arquitectura-dotnet-rest
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "${DOTNET_REST_PORT}:8080"
    networks:
      - arquitectura-net

  dotnet-grpc-api:
    build:
      context: ./servidores/dotnet-grpc-api
      dockerfile: Dockerfile
    container_name: arquitectura-dotnet-grpc
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "${GRPC_PORT}:8080"
    networks:
      - arquitectura-net

  camunda-zeebe:
    image: camunda/zeebe:8.5.8
    container_name: arquitectura-camunda-zeebe
    ports:
      - "${CAMUNDA_ZEEBE_PORT}:26500"
    networks:
      - arquitectura-net

networks:
  arquitectura-net:
    driver: bridge

volumes:
  mariadb-data:
  mysql-data:
  sqlserver-data:
